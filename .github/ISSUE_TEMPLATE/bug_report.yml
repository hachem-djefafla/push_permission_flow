name: Bug report
description: Report a problem with push_permission_flow
title: "[Bug]: "
labels: ["bug"]

body:
  - type: textarea
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction
      description: Provide a minimal reproducible example.
    validations:
      required: true

  - type: input
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    attributes:
      label: Dart / Flutter version
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Dart only
        - Other
    validations:
      required: true